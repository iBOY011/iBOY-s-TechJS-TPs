<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Book Reading Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <div class="max-w-5xl mx-auto py-10">
      <h1 class="text-3xl font-bold text-center mb-8">
        Book Reading Tracker
      </h1>

      <div class="bg-white shadow-md rounded-lg p-6 mb-8">
        <h2 class="text-xl font-semibold mb-4">Add a new book</h2>
        <form id="book-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input
              id="title"
              type="text"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Author</label>
            <input
              id="author"
              type="text"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Number of pages</label>
            <input
              id="pages"
              type="number"
              min="1"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Pages read</label>
            <input
              id="pagesRead"
              type="number"
              min="0"
              value="0"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Status</label>
            <select
              id="status"
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            >
              <option>Read</option>
              <option>Re-read</option>
              <option>DNF</option>
              <option>Currently reading</option>
              <option>Returned Unread</option>
              <option>Want to read</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Format</label>
            <select
              id="format"
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            >
              <option>Print</option>
              <option>PDF</option>
              <option>Ebook</option>
              <option>AudioBook</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Price</label>
            <input
              id="price"
              type="number"
              min="0"
              step="0.01"
              required
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Suggested by</label>
            <input
              id="suggestedBy"
              type="text"
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring focus:ring-indigo-200"
            />
          </div>

          <div class="md:col-span-2 flex justify-end mt-2">
            <button
              type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded"
            >
              Add book
            </button>
          </div>
        </form>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white shadow rounded p-4">
          <p class="text-sm text-gray-500">Total books</p>
          <p id="total-books" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-white shadow rounded p-4">
          <p class="text-sm text-gray-500">Books finished</p>
          <p id="books-finished" class="text-2xl font-bold">0</p>
        </div>
        <div class="bg-white shadow rounded p-4">
          <p class="text-sm text-gray-500">Pages read / total pages</p>
          <p id="pages-global" class="text-2xl font-bold">0 / 0</p>
        </div>
      </div>

      <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-xl font-semibold mb-4">Your books</h2>
        <table class="min-w-full text-left text-sm">
          <thead>
            <tr class="border-b">
              <th class="py-2 pr-4">Title</th>
              <th class="py-2 pr-4">Author</th>
              <th class="py-2 pr-4">Status</th>
              <th class="py-2 pr-4">Format</th>
              <th class="py-2 pr-4">Progress</th>
              <th class="py-2 pr-4">Finished</th>
              <th class="py-2 pr-4">Actions</th>
            </tr>
          </thead>
          <tbody id="books-table-body"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
